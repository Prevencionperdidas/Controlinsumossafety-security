<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0058A3">
<title>Entrega de Insumos PPS</title>
<style>
:root{--b:#0058A3;--bd:#004182;--y:#FFDB00;--bg:#eef1f5;--ok:#0a8a4a;--err:#cc0008;--tx:#1b1f24;--mu:#6b7480;--ln:#dde2e8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--b);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;position:sticky;top:0;z-index:20}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
#logo{height:38px;width:auto;display:none}
header h1{font-size:17px;margin:0;line-height:1.1}header small{color:#cfe0f2;font-size:11px}
.pill{border:0;border-radius:20px;padding:6px 11px;font-size:12px;font-weight:600;background:#fff;color:var(--b);cursor:pointer;white-space:nowrap}
.pill.pend{background:var(--y);color:#222}.pill.off{background:#ffd6d6;color:var(--err)}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--b)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font-size:16px;font-family:inherit;margin-top:3px;background:#fff;color:var(--tx)}
input:not([data-noup]),textarea{text-transform:uppercase}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:0;background:var(--b);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
.btn.y{background:var(--y);color:#111}.btn.ghost{background:#e8eef5;color:var(--b)}.btn.sm{padding:7px 11px;font-size:13px}
.btn.big{width:100%;padding:16px;font-size:17px;background:var(--y);color:#111;margin-bottom:20px}
.btn.icon{font-size:20px;padding:0 14px}
.scanrow{display:flex;gap:8px}.scanrow input{margin:0}
.muted{color:var(--mu);font-size:13px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin:12px 0}
.cat{position:relative;border:2px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;user-select:none}
.cat:active{transform:scale(.97)}
.cat.on{border-color:var(--b);box-shadow:0 0 0 3px rgba(0,88,163,.18)}
.im{aspect-ratio:4/3;background:#eef3f9;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.cl{padding:8px 10px}.cl b{display:block;font-size:14px;line-height:1.2}.cl small{color:var(--mu);font-size:12px}
.cat.on .cl{background:var(--b);color:#fff}.cat.on .cl small{color:#cfe0f2}
.cb{position:absolute;top:6px;right:6px;background:var(--y);color:#111;font-weight:800;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.panel{background:#f4f8fc;border:1px solid #d4e2f1;border-radius:12px;padding:10px;margin-bottom:12px}
.panel h3{margin:2px 0 10px;font-size:15px;color:var(--b);display:flex;justify-content:space-between;align-items:center}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.it{background:#fff;border:2px solid var(--ln);border-radius:12px;overflow:hidden;position:relative}
.it.sel{border-color:var(--y)}
.it .im{aspect-ratio:1;cursor:pointer;font-size:40px}
.it .cl{padding:6px 8px}.it .cl b{font-size:13px}
.qty{display:flex;align-items:center}
.qty button{width:36px;height:36px;border:1px solid var(--ln);background:#f5f7fa;font-size:20px;cursor:pointer}
.qty button:first-child{border-radius:8px 0 0 8px}.qty button:last-child{border-radius:0 8px 8px 0}
.qty input{width:60px;height:36px;margin:0;border-radius:0;text-align:center;border-left:0;border-right:0;padding:4px}
.it .qty{padding:0 6px 8px;justify-content:center}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.cn{flex:1;min-width:0}.cn b{display:block;font-size:14px}.cn small{color:var(--mu);font-size:12px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.x{border:0;background:none;color:var(--err);font-size:18px;cursor:pointer;padding:6px}
h3.selh{font-size:14px;margin:6px 0 0;color:var(--b)}
canvas.sig{width:100%;height:170px;border:2px dashed #b9c3cf;border-radius:10px;background:#fff;display:block;margin-bottom:8px;touch-action:none}
#modal,#cam{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on,#cam.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.mbox h3{margin:0 0 10px;color:var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid #eef1f4;text-align:left}.n{text-align:right}
.camb{background:#000;border-radius:14px;max-width:480px;width:100%;padding:10px;text-align:center}
.camb video,#qrReader{width:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;display:none;max-width:90vw;text-align:center}
#toast.ok{background:var(--ok)}#toast.err{background:var(--err)}
</style>
</head>
<body>
<header>
  <div class="hl"><img id="logo" alt="PPS"><div><h1>Entrega de Insumos</h1><small>Prevención de Pérdidas y Seguridad · IKEA CD</small></div></div>
  <button id="pill" class="pill" onclick="manualSync()">…</button>
</header>
<main>
  <div class="card">
    <h2>1 · ¿Qué insumos se entregan?</h2>
    <div class="scanrow">
      <input id="scanE" data-noup list="dlIns" placeholder="Escanea el QR / código o escribe el nombre" autocomplete="off">
      <button class="btn icon" onclick="openCam()" title="Escanear con cámara">📷</button>
    </div>
    <div id="pick"></div>
    <h3 class="selh">Seleccionados para entregar</h3>
    <div id="cart"></div>
  </div>
  <div class="card">
    <h2>2 · Datos de la entrega</h2>
    <div class="grid2">
      <label>Área que recibe *<select id="eArea"></select></label>
      <label>Nombre de quien recibe *<input id="eRec" autocomplete="off"></label>
      <label>Turno (automático según la hora)<input id="eTurno" disabled></label>
    </div>
    <label>Observación<textarea id="eObs" rows="2" placeholder="OPCIONAL"></textarea></label>
  </div>
  <div class="card">
    <h2>3 · Firma de quien recibe <span class="muted">(obligatoria)</span></h2>
    <canvas id="sig" class="sig"></canvas>
    <button class="btn ghost sm" onclick="SIG.clear()">Limpiar firma</button>
  </div>
  <button class="btn big" onclick="registrar()">✔ Registrar entrega</button>
</main>

<datalist id="dlIns"></datalist>
<div id="modal"><div class="mbox" id="mBody"></div></div>
<div id="cam" onclick="if(event.target===this)closeCam()"><div class="camb"><video id="camV" playsinline muted></video><div id="qrReader"></div><button class="btn y" style="margin-top:10px" onclick="closeCam()">Cerrar cámara</button></div></div>
<div id="toast"></div>

<script>
/* =================== CONFIGURACIÓN (misma URL que index.html) =================== */
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbwkMM-PjSsTfA_VGUtc-7wD-KxP6Kfj7cvON9XvWuIHlRKOVqnG2YFZgIIqUf8lJE6d/exec';
const LOGO_SRC = '';

/* =================== UTILIDADES =================== */
let API = localStorage.getItem('ins_api') || API_DEFAULT;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch { toast('Memoria del equipo llena', 'err') } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const fmtDT = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n };
const fmtN = n => Number(n || 0).toLocaleString('es-CL', { maximumFractionDigits: 2 });
const up = s => String(s ?? '').trim().toUpperCase();
function toast(m, c = '') { const t = $('#toast'); t.textContent = m; t.className = c; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3000) }
function beep(ok = true) { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = ok ? 1150 : 300; o.connect(a.destination); o.start(); o.stop(a.currentTime + (ok ? .09 : .3)) } catch {} if (navigator.vibrate) navigator.vibrate(ok ? 40 : [80, 50, 80]) }
const apiOk = () => /^https:\/\/script\.google\.com\//.test(API);
function jsonp(params, timeout = 25000) {
  return new Promise((res, rej) => {
    const cb = 'cb_' + uid(), s = document.createElement('script');
    const t = setTimeout(() => { done(); rej(new Error('timeout')) }, timeout);
    function done() { clearTimeout(t); delete window[cb]; s.remove() }
    window[cb] = d => { done(); res(d) }; s.onerror = () => { done(); rej(new Error('red')) };
    s.src = API + '?' + new URLSearchParams({ ...params, callback: cb, _: Date.now() }); document.body.appendChild(s);
  });
}

/* =================== CATÁLOGO, FOTOS Y COLA =================== */
let CAT = load('ent_cat', { insumos: [], areas: [] });
let FOTOS = load('ins_fotos', { ver: '', map: {} });
let QUEUE = load('ent_queue', []);
let CART = load('ent_cart', []);
let NETERR = false, SYNCING = false, OPEN = null, CATS = [];
const findIns = c => CAT.insumos.find(i => up(i.Codigo) === up(c));
const fotoOf = (t, c) => FOTOS.map[t + '|' + up(c)] || '';
async function refresh() {
  if (!apiOk()) return updPill();
  try {
    const r = await jsonp({ action: 'catalogo' });
    if (!r.ok) throw 0;
    CAT = { insumos: r.insumos || [], areas: r.areas || [] }; save('ent_cat', CAT); NETERR = false;
    if (String(r.fotosVer) !== String(FOTOS.ver)) {
      const f = await jsonp({ action: 'fotos' }, 60000);
      if (f.ok) { const map = {}; (f.fotos || []).forEach(x => { if (x.Foto) map[x.Tipo + '|' + up(x.Clave)] = x.Foto }); FOTOS = { ver: String(f.ver), map }; save('ins_fotos', FOTOS) }
    }
    renderAll();
  } catch { NETERR = true; updPill() }
}
async function sync() {
  if (SYNCING || !apiOk()) return updPill();
  SYNCING = true; updPill();
  try {
    for (const op of QUEUE) {
      if (op.sent && Date.now() - op.sent < 20000) continue;
      await fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(op) });
      op.sent = Date.now(); save('ent_queue', QUEUE);
    }
    if (QUEUE.length) {
      const ids = QUEUE.map(o => o.opId), ok = [];
      for (let i = 0; i < ids.length; i += 25) { const r = await jsonp({ action: 'confirm', ids: ids.slice(i, i + 25).join(',') }); if (r.ok) ok.push(...r.ids) }
      QUEUE = QUEUE.filter(o => !ok.includes(o.opId)); save('ent_queue', QUEUE);
    }
    NETERR = false;
  } catch { NETERR = true }
  SYNCING = false; updPill();
}
function manualSync() { QUEUE.forEach(o => o.sent = 0); sync().then(() => toast(QUEUE.length ? `Quedan ${QUEUE.length} entregas por enviar` : 'Todo enviado ✔', QUEUE.length ? '' : 'ok')); refresh() }
function updPill() {
  const p = $('#pill'), n = QUEUE.length;
  if (!apiOk()) { p.className = 'pill off'; p.textContent = '⚙ Sin configurar'; return }
  if (SYNCING) { p.className = 'pill pend'; p.textContent = '⟳ Enviando…'; return }
  if (!navigator.onLine || NETERR) { p.className = 'pill off'; p.textContent = `⚠ Sin conexión${n ? ' · ' + n + ' por enviar' : ''}`; return }
  if (n) { p.className = 'pill pend'; p.textContent = `⏳ ${n} por enviar`; return }
  p.className = 'pill'; p.textContent = '✔ Conectado';
}

/* =================== SELECTOR VISUAL =================== */
const EMO = [[/calzad|zapat|bota/i, '🥾'], [/guante/i, '🧤'], [/cortante|cuchill|cutter|micro/i, '🔪'], [/casco/i, '⛑️'], [/lente|gafa|antiparra/i, '🥽'], [/chaleco|reflect/i, '🦺'], [/oído|auditiv|tapón/i, '🎧'], [/mascar|respir/i, '😷'], [/cinta|fleje|sello/i, '📦'], [/pila|bater|linterna/i, '🔦'], [/papel|resma|oficina/i, '📄'], [/radio/i, '📻']];
const emoji = s => (EMO.find(([r]) => r.test(s || '')) || [0, '🧰'])[1];
const imHtml = (src, alt) => src ? `<img src="${src}" alt="" loading="lazy">` : emoji(alt);
function groupCats() { const g = {}; CAT.insumos.forEach(i => { const c = String(i.Categoria || '').trim() || 'Otros'; (g[c] = g[c] || []).push(i) }); Object.values(g).forEach(l => l.sort((a, b) => String(a.Nombre).localeCompare(String(b.Nombre), 'es'))); return g }
const cartQty = c => num(CART.find(x => up(x.Codigo) === up(c))?.qty);
function renderPicker() {
  const g = groupCats(), cats = Object.keys(g).sort((a, b) => a === 'Otros' ? 1 : b === 'Otros' ? -1 : a.localeCompare(b, 'es'));
  CATS = cats; if (OPEN && !g[OPEN]) OPEN = null;
  if (!cats.length) { $('#pick').innerHTML = `<p class="muted">${apiOk() ? 'Cargando catálogo…' : 'Página sin configurar.'}</p>`; return }
  let h = '<div class="cats">' + cats.map((c, ci) => {
    const n = g[c].reduce((a, i) => a + cartQty(i.Codigo), 0), f = fotoOf('CAT', c) || g[c].map(i => fotoOf('INS', i.Codigo)).find(Boolean) || '';
    return `<div class="cat ${OPEN === c ? 'on' : ''}" onclick="toggleCat(${ci})"><div class="im">${imHtml(f, c)}</div><div class="cl"><b>${esc(c)}</b><small>${g[c].length} insumo${g[c].length > 1 ? 's' : ''} · ${OPEN === c ? 'tocar para cerrar' : 'tocar para ver'}</small></div>${n ? `<span class="cb">${fmtN(n)}</span>` : ''}</div>`;
  }).join('') + '</div>';
  if (OPEN) {
    h += `<div class="panel" id="panel"><h3><span>${esc(OPEN)}</span><button class="btn sm ghost" onclick="OPEN=null;renderPicker()">✕ Cerrar</button></h3><div class="items">` + g[OPEN].map(i => {
      const q = cartQty(i.Codigo), c = esc(i.Codigo);
      return `<div class="it ${q ? 'sel' : ''}"><div class="im" onclick="addToCart('${c}')">${imHtml(fotoOf('INS', i.Codigo), i.Nombre + ' ' + OPEN)}</div>${q ? `<span class="cb">${fmtN(q)}</span>` : ''}
        <div class="cl"><b>${esc(i.Nombre)}</b><small>${esc(i.Unidad || '')}</small></div>
        ${q ? `<div class="qty"><button onclick="qty('${c}',-1)">−</button><input type="number" inputmode="decimal" value="${q}" onchange="qty('${c}',0,this.value)"><button onclick="qty('${c}',1)">+</button></div>` : ''}</div>`;
    }).join('') + '</div><p class="muted" style="margin:8px 0 0">Toca la foto para agregar 1 unidad. Ajusta con − / +.</p></div>';
  }
  $('#pick').innerHTML = h;
}
function toggleCat(ci) { const c = CATS[ci]; OPEN = OPEN === c ? null : c; renderPicker(); if (OPEN) setTimeout(() => $('#panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30) }
function addToCart(code, n = 1) {
  const ins = findIns(code);
  if (!ins) { beep(false); return toast('Insumo no encontrado: ' + code, 'err') }
  const ex = CART.find(x => up(x.Codigo) === up(ins.Codigo));
  if (ex) ex.qty = num(ex.qty) + n; else CART.unshift({ Codigo: ins.Codigo, qty: n });
  beep(); renderCart(); toast(`${ins.Nombre}: ${fmtN(ex ? ex.qty : n)}`, 'ok');
}
function qty(code, d, val) { const i = CART.findIndex(x => up(x.Codigo) === up(code)); if (i < 0) return; const n = val !== undefined ? num(val) : num(CART[i].qty) + d; if (n <= 0) CART.splice(i, 1); else CART[i].qty = n; renderCart() }
function renderCart() {
  save('ent_cart', CART); renderPicker();
  if (!CART.length) { $('#cart').innerHTML = '<p class="muted">Nada seleccionado. Toca una categoría y luego la foto del insumo.</p>'; return }
  $('#cart').innerHTML = CART.map(x => { const i = findIns(x.Codigo) || { Nombre: x.Codigo }, f = fotoOf('INS', x.Codigo), c = esc(x.Codigo);
    return `<div class="ci">${f ? `<img class="thumb" src="${f}">` : ''}<div class="cn"><b>${esc(i.Nombre)}</b><small>${esc(i.Categoria || '')}</small></div>
      <div class="qty"><button onclick="qty('${c}',-1)">−</button><input type="number" inputmode="decimal" value="${x.qty}" onchange="qty('${c}',0,this.value)"><button onclick="qty('${c}',1)">+</button></div><button class="x" onclick="qty('${c}',0,0)">✕</button></div>` }).join('');
}
function renderAll() {
  $('#dlIns').innerHTML = CAT.insumos.map(i => `<option value="${esc(i.Codigo)} — ${esc(i.Nombre)}">`).join('');
  const s = $('#eArea'), v = s.value;
  s.innerHTML = '<option value="">— Selecciona —</option>' + CAT.areas.map(a => a.Area).sort((a, b) => String(a).localeCompare(String(b), 'es')).map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
  s.value = v; renderCart(); updPill();
}

/* =================== ESCANEO =================== */
function onScan(t) {
  t = String(t || '').trim(); if (!t) return;
  let code = null, area = null;
  if (/^https?:\/\//i.test(t)) { try { const u = new URL(t); code = u.searchParams.get('i'); area = u.searchParams.get('a') } catch {} }
  else { const m = t.match(/^(.+?)\s+—\s+/); if (m) t = m[1]; const ins = findIns(t) || CAT.insumos.find(i => up(i.Nombre) === up(t)); if (ins) code = ins.Codigo; else { const a = CAT.areas.find(a => up(a.Area) === up(t)); if (a) area = a.Area; else code = t } }
  if (area) { const a = CAT.areas.find(x => up(x.Area) === up(area)); if (a) { $('#eArea').value = a.Area; beep(); toast('Área: ' + a.Area, 'ok') } else { beep(false); toast('Área no registrada', 'err') } }
  if (code) addToCart(code);
}
const sc = $('#scanE');
sc.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === 'Tab') && sc.value.trim()) { e.preventDefault(); onScan(sc.value); sc.value = '' } });
sc.addEventListener('input', e => { if ((!e.inputType || e.inputType === 'insertReplacementText') && sc.value.includes(' — ')) { onScan(sc.value); sc.value = '' } });
let CAM = { stream: null, raf: null, h5: null };
async function openCam() {
  $('#cam').classList.add('on'); const v = $('#camV');
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] });
      CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      v.style.display = 'block'; v.srcObject = CAM.stream; await v.play();
      const loop = async () => { if (!CAM.stream) return; try { const c = await det.detect(v); if (c.length) { const t = c[0].rawValue; closeCam(); onScan(t); return } } catch {} CAM.raf = requestAnimationFrame(loop) };
      loop(); return;
    } catch { stopStream() }
  }
  v.style.display = 'none';
  try {
    if (!window.Html5Qrcode) await new Promise((r, j) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'; s.onload = r; s.onerror = j; document.head.appendChild(s) });
    CAM.h5 = new Html5Qrcode('qrReader');
    await CAM.h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: 230 }, t => { closeCam(); onScan(t) });
  } catch { closeCam(); toast('No se pudo abrir la cámara', 'err') }
}
function stopStream() { if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null } cancelAnimationFrame(CAM.raf) }
function closeCam() { stopStream(); if (CAM.h5) { const h = CAM.h5; CAM.h5 = null; h.stop().catch(() => {}).finally(() => { try { h.clear() } catch {} }) } $('#cam').classList.remove('on') }

/* =================== FIRMA =================== */
function SigPad(cv) {
  const ctx = cv.getContext('2d'); let drawing = false, dirty = false, last;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top } };
  function size() { const r = cv.getBoundingClientRect(); if (!r.width) return; const d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; dirty = false }
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId) });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
  return { size, isEmpty: () => !dirty,
    clear: () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); dirty = false },
    data: () => { const o = document.createElement('canvas'), w = 480, h = Math.round(w * cv.height / cv.width); o.width = w; o.height = h; const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.drawImage(cv, 0, 0, w, h); return o.toDataURL('image/png') } };
}
const SIG = SigPad($('#sig'));

/* =================== REGISTRAR =================== */
function turnoAuto() { const h = new Date().getHours(); return h >= 6 && h < 14 ? 'MAÑANA' : h >= 14 && h < 22 ? 'TARDE' : 'NOCHE' }
function registrar() {
  const items = CART.filter(x => num(x.qty) > 0), area = $('#eArea').value, rec = up($('#eRec').value), obs = up($('#eObs').value);
  if (!items.length) return toast('Selecciona al menos un insumo', 'err');
  if (!area) return toast('Selecciona el área que recibe', 'err');
  if (!rec) return toast('Indica quién recibe', 'err');
  if (SIG.isEmpty()) return toast('Falta la firma de quien recibe', 'err');
  const now = new Date(), vale = `E-${String(now.getFullYear()).slice(2)}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${Math.random().toString(36).slice(2, 4).toUpperCase()}`;
  const movs = items.map((x, i) => { const ins = findIns(x.Codigo); return { ID: vale + '-' + (i + 1), ts: now.getTime(), FechaHora: fmtDT(now), Tipo: 'ENTREGA', Vale: vale, Codigo: ins.Codigo, Insumo: ins.Nombre, Unidad: ins.Unidad || '', Cantidad: num(x.qty), Delta: -num(x.qty), Area: area, Receptor: rec, Responsable: '', Turno: turnoAuto(), Proveedor: '', Documento: '', Observacion: obs, Estado: 'VIGENTE' } });
  const firma = SIG.data();
  QUEUE.push({ opId: uid(), ts: Date.now(), action: 'movs', movs, firma }); save('ent_queue', QUEUE);
  CART = []; renderCart(); $('#eRec').value = ''; $('#eObs').value = ''; SIG.clear(); OPEN = null; renderPicker();
  $('#mBody').innerHTML = `<h3>✔ Entrega registrada</h3><p><b>Vale:</b> ${esc(vale)}<br><b>Área:</b> ${esc(area)}<br><b>Recibe:</b> ${esc(rec)}<br><b>Turno:</b> ${turnoAuto()}</p>
    <table><tr><th>Insumo</th><th class="n">Cantidad</th></tr>${movs.map(m => `<tr><td>${esc(m.Insumo)}</td><td class="n">${fmtN(m.Cantidad)} ${esc(m.Unidad)}</td></tr>`).join('')}</table>
    <img src="${firma}" style="max-width:240px;border:1px solid #ddd;border-radius:8px;margin-top:8px">
    <button class="btn y" style="width:100%;margin-top:12px" onclick="$('#modal').classList.remove('on');window.scrollTo({top:0,behavior:'smooth'})">Nueva entrega</button>`;
  $('#modal').classList.add('on');
  sync();
}

/* =================== INICIO =================== */
(function init() {
  if (LOGO_SRC) { $('#logo').src = LOGO_SRC; $('#logo').style.display = 'block' }
  const setT = () => $('#eTurno').value = turnoAuto(); setT(); setInterval(setT, 60000);
  document.addEventListener('input', e => { const t = e.target; if (!((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA') || 'noup' in t.dataset) return; const v = t.value.toUpperCase(); if (v === t.value) return; const p = t.selectionStart; t.value = v; try { t.setSelectionRange(p, p) } catch {} }, true);
  window.addEventListener('resize', () => { if (SIG.isEmpty()) SIG.size() });
  window.addEventListener('online', () => { sync(); refresh() }); window.addEventListener('offline', updPill);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); refresh() } });
  renderAll(); setTimeout(() => SIG.size(), 50);
  const p = new URLSearchParams(location.search), qi = p.get('i'), qa = p.get('a');
  if (qi || qa) history.replaceState(null, '', location.pathname);
  const fromQR = () => { if (qa) onScan(qa); if (qi) addToCart(qi) };
  if (qi || qa) { if (CAT.insumos.length) { fromQR(); refresh() } else refresh().then(fromQR) } else refresh();
  sync(); setInterval(() => { if (!document.hidden) { sync() } }, 90000);
})();
</script>
